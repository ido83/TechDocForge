name: Python and Qt tests
description: Install Qt runtime libraries and run the TechDocForge tests.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install Qt runtime libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes libdbus-1-3 libegl1 libgl1 libxkbcommon0
    - name: Install dependencies and run tests
      shell: bash
      run: |
        python -m pip install -r requirements-dev.txt 'pip-audit==2.10.1'
        if [[ -f requirements.lock ]]; then
          python -m pip install --require-hashes -r requirements.lock
        fi
        python -m pip check
        python -m pytest -q tests
