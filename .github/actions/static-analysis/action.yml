name: Static analysis (SAST)
description: Scan TechDocForge Python source with Bandit.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Scan Python with Bandit
      shell: bash
      run: |
        python -m pip install 'bandit==1.9.4'
        python -m bandit -r run.py techdocforge
