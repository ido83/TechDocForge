name: Lint Python and workflows
description: Check Python and GitHub Actions workflow syntax.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Lint Python with Ruff
      shell: bash
      run: |
        python -m pip install 'ruff==0.15.12'
        ruff check --select E9,F63,F7,F82 run.py techdocforge tests
    - name: Lint GitHub Actions workflows
      working-directory: ${{ runner.temp }}
      shell: bash
      run: |
        curl --fail --silent --show-error --location --retry 3 --output actionlint.tar.gz \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
        tar -xzf actionlint.tar.gz actionlint
        cd "$GITHUB_WORKSPACE"
        "$RUNNER_TEMP/actionlint"
